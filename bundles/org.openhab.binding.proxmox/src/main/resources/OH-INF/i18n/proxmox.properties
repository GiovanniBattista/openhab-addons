# add-on
addon.proxmox.name = Proxmox Binding
addon.proxmox.description = Binding for Proxmox VE hosts to start/stop nodes, VMs and LXC containers and to monitor their state.

# thing status descriptions
offline.node-removed = The node is no longer reported by the Proxmox host.
offline.node-gone = The node no longer exists on the Proxmox host.
offline.vm-removed = The VM is no longer reported by the Proxmox host.
offline.vm-gone = The VM no longer exists on the Proxmox host.
offline.lxc-removed = The container is no longer reported by the Proxmox host.
offline.lxc-gone = The container no longer exists on the Proxmox host.

# add-on
addon.proxmox.name = Proxmox Binding
addon.proxmox.description = Binding für Proxmox VE Hosts, um Nodes, VMs und LXC-Container zu starten/stoppen und deren Zustand zu überwachen.

# thing types
thing-type.proxmox.host.label = Proxmox Host
thing-type.proxmox.host.description = Der Proxmox VE Host, der als Bridge zu seinen Nodes, VMs und Containern dient.
thing-type.proxmox.node.label = Proxmox Node
thing-type.proxmox.node.description = Ein Node (physischer Host) eines Proxmox VE (Clusters).
thing-type.proxmox.vm.label = Proxmox VM
thing-type.proxmox.vm.description = Eine virtuelle QEMU-Maschine eines Proxmox VE Nodes.
thing-type.proxmox.lxc.label = Proxmox LXC
thing-type.proxmox.lxc.description = Ein Linux-Container (LXC) eines Proxmox VE Nodes.

# thing type config descriptions
thing-type.config.proxmox.host.baseUrl.label = Host-URL
thing-type.config.proxmox.host.baseUrl.description = Die Basis-URL der Proxmox VE API, z.B. https://pve:8006/
thing-type.config.proxmox.host.username.label = Benutzername
thing-type.config.proxmox.host.username.description = Benutzername für die Proxmox REST API inklusive Realm, z.B. openhab@pam. Muss die nötigen Zugriffsrechte besitzen.
thing-type.config.proxmox.host.password.label = Passwort
thing-type.config.proxmox.host.password.description = Passwort für die Proxmox REST API.
thing-type.config.proxmox.host.macAddress.label = MAC-Adresse
thing-type.config.proxmox.host.macAddress.description = Wird hier die MAC-Adresse des Hosts eingetragen, versucht das Binding den Host per Wake on LAN (WOL) einzuschalten, wenn ein ON-Befehl am Power-Kanal eines Nodes empfangen wird. Erlaubt sind sechs Gruppen zweistelliger Hexadezimalzahlen, getrennt durch Bindestriche oder Doppelpunkte, z.B. '3c:cd:93:c2:20:e0'. Bleibt das Feld leer, wird die Adresse per ARP automatisch ermittelt.
thing-type.config.proxmox.host.pollingInterval.label = Abfrageintervall
thing-type.config.proxmox.host.pollingInterval.description = Sekunden zwischen den Abfragen der Proxmox API.

# channel types
channel-type.proxmox.status.label = Status
channel-type.proxmox.status.description = Der aktuell von Proxmox VE gemeldete Status (z.B. running, stopped, online, offline).
channel-type.proxmox.cpu-load.label = CPU-Auslastung
channel-type.proxmox.cpu-load.description = Die aktuelle CPU-Auslastung.
channel-type.proxmox.memory-used.label = Speicher belegt
channel-type.proxmox.memory-used.description = Der aktuell belegte Arbeitsspeicher.
channel-type.proxmox.memory-total.label = Speicher gesamt
channel-type.proxmox.memory-total.description = Der maximal verfügbare Arbeitsspeicher.
channel-type.proxmox.disk-used.label = Festplatte belegt
channel-type.proxmox.disk-used.description = Der aktuell belegte Festplattenspeicher.
channel-type.proxmox.disk-total.label = Festplatte gesamt
channel-type.proxmox.disk-total.description = Der maximal verfügbare Festplattenspeicher.
channel-type.proxmox.uptime.label = Betriebszeit
channel-type.proxmox.uptime.description = Die seit dem letzten Start vergangene Zeit.

# thing status descriptions
offline.node-removed = Der Node wird vom Proxmox-Host nicht mehr gemeldet.
offline.node-gone = Der Node existiert auf dem Proxmox-Host nicht mehr.
offline.vm-removed = Die VM wird vom Proxmox-Host nicht mehr gemeldet.
offline.vm-gone = Die VM existiert auf dem Proxmox-Host nicht mehr.
offline.lxc-removed = Der Container wird vom Proxmox-Host nicht mehr gemeldet.
offline.lxc-gone = Der Container existiert auf dem Proxmox-Host nicht mehr.
